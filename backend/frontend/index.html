<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Policy Intelligence Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="ai-badge">AI • POLICY ANALYSIS</div>

        <h1>Policy Intelligence Assistant</h1>

        <p class="subtitle">Upload a policy PDF and ask questions about it.</p>



    <h2>Upload Policy</h2>

    <div class="upload-area">

    <label for="policyFile" class="upload-box">
        <span class="upload-icon">📄</span>
        <span class="upload-title">Choose a policy PDF</span>
        <span class="upload-text">Click here to select your PDF file</span>
    </label>

    <input
        type="file"
        id="policyFile"
        accept=".pdf"
        hidden
    >

</div>

    <button id="uploadButton">Upload Policy</button>
    <button id="clearButton">Clear / New Policy</button>

    <p id="uploadStatus"></p>

    <div id="suggestedQuestions" class="suggested-questions" hidden>
        <h3>Suggested Questions</h3>
        <div id="suggestedQuestionList"></div>
    </div>

</div>

<div class="card">


    <h2>Ask a Question</h2>

    <div id="chatHistory" class="chat-history"></div>

    <input
        type="text"
        id="questionInput"
        class="question-input"
        placeholder="Ask something about your policy"
    >

    <button id="askButton">Ask</button>

</div>

<script>

    const uploadButton = document.getElementById("uploadButton");

    uploadButton.addEventListener("click", async () => {

        const fileInput = document.getElementById("policyFile");
        const uploadStatus = document.getElementById("uploadStatus");

        if (!fileInput.files.length) {
            uploadStatus.textContent = "Please select a PDF file first.";
            uploadStatus.className = "error";
            return;
        }

        const file = fileInput.files[0];


if (file.type !== "application/pdf") {
    uploadStatus.textContent = "Please select a PDF file.";
    uploadStatus.className = "error";
    return;
}

        const uploadBox = document.querySelector(".upload-box");
        uploadBox.querySelector(".upload-text").textContent = file.name;

        const formData = new FormData();
        formData.append("file", file);

        const sessionId = crypto.randomUUID();
        localStorage.setItem("sessionId", sessionId);

        uploadStatus.textContent = "Uploading policy...";

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/upload-policy",
                {
                    method: "POST",
                    headers: {
                        "session-id": sessionId
                    },
                    body: formData
                }
            );

            const data = await response.json();

            if (response.ok) {
                uploadStatus.textContent =
                    `Policy uploaded successfully! ${data.chunks} chunks created.`;

                const suggestedQuestions =
                    document.getElementById("suggestedQuestions");

                const suggestedQuestionList =
                    document.getElementById("suggestedQuestionList");

                suggestedQuestionList.innerHTML = "";

                data.suggested_questions.forEach((question) => {

                    const questionButton = document.createElement("button");

                    questionButton.textContent = question;
                    questionButton.className = "suggested-question";

                    questionButton.style.display = "block";
                    questionButton.style.width = "100%";
                    questionButton.style.marginBottom = "10px";

                    questionButton.addEventListener("click", () => {
                        document.getElementById("questionInput").value = question;
                        document.getElementById("askButton").click();
                    });

                    suggestedQuestionList.appendChild(questionButton);
                });

                suggestedQuestions.hidden = false;

              } else {
                uploadStatus.textContent =
                    "Upload failed.";
            }

        } catch (error) {

            uploadStatus.textContent =
                "Could not connect to the backend.";

            console.error(error);
        }

    });

const askButton = document.getElementById("askButton");

clearButton.addEventListener("click", () => {

    localStorage.removeItem("sessionId");

    document.getElementById("policyFile").value = "";
    document.querySelector(".upload-text").textContent =
        "Click here to select your PDF file";

    document.getElementById("uploadStatus").textContent = "";
    document.getElementById("uploadStatus").className = "";

    const chatHistory = document.getElementById("chatHistory");
    chatHistory.textContent = "";
    chatHistory.hidden = true;
    

    document.getElementById("questionInput").value = "";

    document.getElementById("suggestedQuestionList").innerHTML = "";
    document.getElementById("suggestedQuestions").hidden = true;

});

askButton.addEventListener("click", async () => {

    const questionInput = document.getElementById("questionInput");
    const chatHistory = document.getElementById("chatHistory");
    chatHistory.hidden = false;

    const question = questionInput.value.trim();

    if (!question) {
    const message = document.createElement("div");
    message.className = "chat-answer";
    message.textContent = "Please enter a question.";
    chatHistory.appendChild(message);
    return;
}
    const sessionId = localStorage.getItem("sessionId");

    if (!sessionId) {
    const message = document.createElement("div");
    message.className = "chat-answer";
    message.textContent = "Please upload a policy PDF first.";
    chatHistory.appendChild(message);
    return;
}



    askButton.disabled = true;
    askButton.textContent = "Thinking...";

    try {

        const response = await fetch(
            `http://127.0.0.1:8000/ask?question=${encodeURIComponent(question)}`,
            {
                method: "POST",
                headers: {
                    "session-id": sessionId
                }
            }
        );

        const data = await response.json();

        if (response.ok) {
            const userMessage = document.createElement("div");
            userMessage.className = "chat-question";
            userMessage.textContent = question;


            const aiMessage = document.createElement("div");
            aiMessage.className = "chat-answer";
           const formattedAnswer = data.answer
                .replace(/\r?\n/g, "\n")
                .replace(/\\+\*/g, "*")
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
                .replace(/^\s*\*\s+/gm, "• ")
                .replace(/\n/g, "<br>");
 
            aiMessage.innerHTML = formattedAnswer;

            chatHistory.appendChild(userMessage);
            chatHistory.appendChild(aiMessage);

            questionInput.value = "";
        } else {
    const message = document.createElement("div");
    message.className = "chat-answer";
    message.textContent = "Could not get an answer.";
    chatHistory.appendChild(message);
}

        askButton.disabled = false;
        askButton.textContent = "Ask";

    } catch (error) {

        chatHistory.textContent = "Could not connect to the backend.";

        console.error(error);
    }

});
</script>

    </div>
</body>
</html>
